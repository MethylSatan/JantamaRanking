name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:api
      - run: npm run build:web
      - run: cd dist/api && zip -q ../api.zip index.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      # 開発中なので、ブラウザは毎回確認しに行く（no-cache）。
      # 画面は Vite のビルド結果（dist/web。web/public の静的ファイルも含む）。
      # rankings/ は Lambda が書くランキングの JSON なので、sync で消さない
      - run: aws s3 sync dist/web "s3://${{ secrets.SITE_BUCKET }}" --delete --cache-control "no-cache" --exclude "rankings/*"
      - run: aws lambda update-function-code --function-name "${{ secrets.API_FUNCTION_NAME }}" --zip-file fileb://dist/api.zip > /dev/null
      - run: aws lambda wait function-updated --function-name "${{ secrets.API_FUNCTION_NAME }}"
      - run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
